<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="google-site-verification" content="bI1dYb_05_PpQb4ZqUF564thj6CFC_Ra43d1JINdl_M" />
  <title>Brandon Sandhu — Papers</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --surface:#ffffff;
      --muted:#6b7280;
      --accent:#0066cc;
      --card-shadow: 0 6px 18px rgba(11,20,40,0.06);
      --radius:12px;
      --max-width:1100px;
    }
    html,body{height:100%}
    body{font-family:Inter,Segoe UI,Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:#0f172a}
    .container{max-width:var(--max-width);margin:0 auto;padding:36px 20px}
    .site-header{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
    .site-header h1{margin:0;font-size:1.6rem}
    .site-header .subtitle{color:var(--muted);margin:0;font-size:0.95rem}
    h2.section{margin-top:28px;margin-bottom:12px;font-size:1.05rem;color:#0b1220}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:8px}
    .grid.grid-4{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
    .card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--card-shadow);transition:transform .18s ease,box-shadow .18s ease}
    .card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(11,20,40,0.08)}
    .card h2{margin:0 0 8px 0;font-size:1.05rem;color:#07243a}
    .card p{margin:0 0 12px 0;color:#334155;font-size:0.95rem;line-height:1.4}
    .actions a{display:inline-block;padding:9px 14px;background:var(--accent);color:#fff;border-radius:8px;text-decoration:none;font-weight:600}
    .note{color:var(--muted);margin-top:6px;font-size:0.95rem}
    header.site-header{padding:18px 0}
    .section-title{display:flex;align-items:center;gap:12px}
    .section-title::before{content:'';display:inline-block;width:36px;height:6px;background:var(--accent);border-radius:4px;opacity:0.12}
    @media (min-width:1200px){
      .container{padding:48px}
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1>Brandon Sandhu — Papers</h1>
      <p class="subtitle">Research papers and notes across ML, parallelism, epidemiology, number theory, cryptography, and miscellaneous topics.</p>
    </header>
    <div id="papers"></div>
  </div>

  <script>
    async function loadPapers(){
      try{
        const res = await fetch('papers.json', {cache: 'no-store'});
        if(!res.ok) throw new Error('Could not load manifest');
        const manifest = await res.json();
        const container = document.getElementById('papers');
        if(!manifest || manifest.length === 0){ container.innerHTML = '<p>No papers found.</p>'; return }

        function createCard(p){
          const card = document.createElement('div'); card.className = 'card';
          const title = document.createElement('h2'); title.textContent = p.title || p.file;
          const desc = document.createElement('p'); desc.textContent = p.description || '';
          const actions = document.createElement('div'); actions.className = 'actions';
          const link = document.createElement('a'); link.href = p.file; link.target = '_blank'; link.rel = 'noopener'; link.textContent = 'Open PDF';
          actions.appendChild(link);
          card.appendChild(title); card.appendChild(desc); card.appendChild(actions);
          return card;
        }

        // Manifest supports either a simple array of items, or an array of sections
        if(manifest[0].section){
          manifest.forEach(section => {
            const heading = document.createElement('h2'); heading.textContent = section.section; heading.className = 'section';
            container.appendChild(heading);
            const grid = document.createElement('div');
            if (section.section && section.section.toLowerCase().includes('epidemiology')) {
              grid.className = 'grid grid-4';
            } else {
              grid.className = 'grid';
            }
            (section.items || []).forEach(p => grid.appendChild(createCard(p)));
            container.appendChild(grid);
          });
        } else {
          const heading = document.createElement('h2'); heading.textContent = 'Papers'; heading.className = 'section';
          container.appendChild(heading);
          const grid = document.createElement('div'); grid.className = 'grid';
          manifest.forEach(p => grid.appendChild(createCard(p)));
          container.appendChild(grid);
        }

      }catch(e){
        document.getElementById('papers').innerHTML = '<p>Unable to load papers manifest.</p>';
        console.error(e);
      }
    }
    loadPapers();
  </script>
</body>
</html>
